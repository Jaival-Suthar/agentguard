version: 1
name: incident-investigation
description: >
  Execution boundaries for the AgentGuard incident-investigation workflow.

actions:
  allow:
    - mcp:incident.lookup:lookup_incident
    - mcp:database.read
    - mcp:github.read
    - sandbox:execute
    - subagent:delegate

  approvalRequired:
    - mcp:github.write
    - operation:restart
    - operation:rollback

  deny:
    - host:filesystem.read
    - host:filesystem.write
    - host:shell
    - secrets:read

limits:
  maxRetries: 3

requirements:
  verificationRequired: true
  requiredActions:
    - mcp:incident.lookup:lookup_incident
    - sandbox:execute
  requiredEvidence:
    - root_cause
    - verification

ordering:
  before:
    - action: mcp:incident.lookup:lookup_incident
      before: sandbox:execute
